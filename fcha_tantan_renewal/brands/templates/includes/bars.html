{% load brand_format %}
<div class="bar-list">
    {% for r in bars %}
        <div class="bar-row">
            <span>{{ r.name }}</span>
            <div class="bar-track"><div class="bar-fill" style="width:{{ r.width }}%"></div></div>
            <span class="bar-value">{{ r.count|number }}{% if r.count != None %}개{% endif %}</span>
        </div>
    {% endfor %}
</div>
