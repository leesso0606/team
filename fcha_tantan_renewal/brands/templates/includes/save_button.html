<form class="save-form" method="post" action="{% url 'brands:saved_toggle' brand.slug %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button class="save-btn {% if brand.slug in saved_ids %}on{% endif %}" aria-label="{{ brand.name }} 관심 브랜드 {% if brand.slug in saved_ids %}해제{% else %}저장{% endif %}" aria-pressed="{% if brand.slug in saved_ids %}true{% else %}false{% endif %}"><svg class="heart-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20.5C10 18.7 3 14 3 8.5C3 5.5 5 3.5 8 3.5C9.7 3.5 11.1 4.4 12 5.8C12.9 4.4 14.3 3.5 16 3.5C19 3.5 21 5.5 21 8.5C21 14 14 18.7 12 20.5Z"/></svg></button>
</form>
