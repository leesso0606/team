function home(){return `<div class="hero"><div><div class="overline" style="color:var(--lemon)">FCHA TANTAN · 2024—2025</div><h1>시작의 기준을,<br><em>탄탄하게.</em></h1><p>내게 맞는 프랜차이즈, 데이터로 비교하세요.</p><button class="btn lemon" onclick="document.querySelector('#filters')?.scrollIntoView({behavior:'smooth'})">브랜드 둘러보기 ↗</button></div><div class="heroshape" aria-hidden="true"></div></div><div id="filters">${pageHeader('FIND YOUR BRAND','어떤 시작을 찾고 있나요?','카페 · 치킨 · 편의점 · 미용실을 한눈에 살펴보세요.')}${filters('home')}<div id="result-area">${filterResult('home')}</div></div>`}
function saved(){const empty=picked.length===0;return `<div class="page-head"><div><div class="overline">MY COLLECTION / SCR-05</div><h1>마음에 담아둔 브랜드</h1><p>관심 있는 브랜드를 모아서 비교하고 상세 정보를 확인하세요.</p></div><span class="count-pill">저장 전체 ${picked.length}개</span></div><div class="status-switch"><strong>화면 상태 체험</strong><button class="btn outline" onclick="picked=['tantan','may','forest'];query='';category='전체';region='전국';render()">저장 3개</button><button class="btn outline" onclick="picked=[];render()">저장 0개</button><button class="btn outline" onclick="picked=['tantan','may','forest'];query='존재하지 않는 브랜드';render()">필터 결과 0개</button><span class="muted">※ 시안 내부의 가상 상태 전환 (운영 사이트 저장과 무관)</span></div>${filters('saved')}<div id="result-area">${filterResult('saved')}</div>`}
function detail(){const b=brand(window.detailId)||DB.brands[0],s=stat(b),entries=Object.entries(s?.regions||{}).sort((a,b)=>b[1]-a[1]);return `${pageHeader('BRAND PROFILE / SCR-02',b.name,b.tagline,yearInput())}<section class="box" style="background:${b.color}66;margin-bottom:20px"><span class="tag">${b.category}</span><h2 style="font-size:34px">${b.english_name}</h2><p>가상 브랜드의 프로필 디자인 시안입니다.</p><button class="btn" onclick="toggleSave('${b.id}')">${picked.includes(b.id)?'♥ 관심 해제':'♡ 관심 저장'}</button> <button class="btn outline" onclick="toggleCompare('${b.id}')">비교 담기</button></section><div class="triple"><div class="metric"><span>전국 연말 매장 수</span><strong>${n(s?.stores)}개</strong></div><div class="metric"><span>연간 신규 개업</span><strong>${n(s?.opened)}개</strong></div><div class="metric"><span>연간 폐업</span><strong>${n(s?.closed)}개</strong></div></div><div class="insight" style="background:var(--lemon)"><h2>평균 월 매출　${n(monthly(b))}만원</h2><p>전국 연평균 매출을 12개월로 나눈 값 · 순이익 아님</p></div><div class="twocol"><div class="insight"><h2>개폐업 현황</h2><div class="bars">${b.stats.map(x=>`<div class="barline"><span>${x.year}년</span><div class="track"><div class="fill" style="width:${Math.min(x.opened/3,100)}%"></div></div><span>${n(x.opened)}개</span></div>`).join('')}</div></div><div class="insight"><h2>지역별 매장 · 상위 5개</h2><div class="bars">${entries.slice(0,5).map(([r,v])=>`<div class="barline"><span>${r}</span><div class="track"><div class="fill" style="width:${100*v/entries[0][1]}%"></div></div><span>${v}개</span></div>`).join('')}</div></div></div><div class="insight"><h2>예시 창업비용</h2><p>${n(Math.round(b.initial_cost_krw/10000))}만원 · 별도 임대료/권리금 등은 포함되지 않을 수 있습니다.</p></div>`}
function comparison(){const bs=compare.map(brand).filter(Boolean),fields=[['전국 연말 매장 수',b=>n(stat(b)?.stores)+'개'],['연간 신규 개업',b=>n(stat(b)?.opened)+'개'],['연간 폐업',b=>n(stat(b)?.closed)+'개'],['평균 월 매출',b=>n(monthly(b))+'만원'],['창업비용(예시)',b=>n(Math.round(b.initial_cost_krw/10000))+'만원'],...DB.regions.map(r=>[`${r} 매장 수`,b=>n(stat(b)?.regions?.[r])+'개'])];return `${pageHeader('SIDE BY SIDE / SCR-03','브랜드를 나란히 비교','동일 연도 기준, 최대 3개 브랜드만 비교할 수 있습니다.',yearInput())}${bs.length?`<div class="toolbar"><strong>${bs.length}개 브랜드 선택</strong><button class="btn outline" onclick="toast('시안에서는 CSV 다운로드를 제공하지 않습니다. 원본 프런트엔드에서 확인하세요.')">CSV 다운로드 (시안)</button></div><div class="table-scroll"><table><thead><tr><th>지표</th>${bs.map(b=>`<th>${b.name} <button class="btn outline" onclick="toggleCompare('${b.id}')">×</button></th>`).join('')}</tr></thead><tbody>${fields.map(([label,fn])=>`<tr><td>${label}</td>${bs.map(b=>`<td>${fn(b)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<div class="empty"><h2>비교할 브랜드가 없어요.</h2><p>브랜드 탐색에서 비교 담기를 눌러 주세요.</p><button class="btn lemon" onclick="navigate('home')">브랜드 찾기</button></div>`}<p class="note">예시 데이터. 지역 수치는 지역 매장 수이며 지역 매출이 아닙니다.</p>`}
function regions(){const list=DB.brands.map(b=>({b,s:stat(b)})).sort((a,b)=>(b.s?.regions?.[selectedRegion]??0)-(a.s?.regions?.[selectedRegion]??0));const total=list.reduce((t,{s})=>t+(s?.regions?.[selectedRegion]??0),0);return `${pageHeader('LOCATION INSIGHT / SCR-04','내가 시작하고 싶은 지역은?','17개 시·도의 등록 브랜드 매장 분포를 확인하세요.',yearInput())}<div class="twocol"><div class="box"><h2>지역 선택</h2><div class="regionchips">${DB.regions.map(r=>`<button class="${r===selectedRegion?'active':''}" onclick="selectedRegion='${r}';render()">${r}</button>`).join('')}</div><p class="note">선택 브랜드의 지역 매장 수 합계로, 모든 프랜차이즈 매장 수가 아닙니다.</p></div><div class="box"><div class="overline">${selectedRegion} · ${year}년</div><h2>등록 브랜드 매장 합계 <span style="font-size:32px">${n(total)}개</span></h2><div class="table-scroll"><table><thead><tr><th>브랜드</th><th>${selectedRegion} 매장</th><th>전국 중 비중</th></tr></thead><tbody>${list.map(({b,s})=>`<tr><td>${b.name}</td><td>${n(s?.regions?.[selectedRegion])}개</td><td>${s?.stores?(s.regions[selectedRegion]/s.stores*100).toFixed(1)+'%':'미제공'}</td></tr>`).join('')}</tbody></table></div></div></div>`}
function guide(){let sections=[['01 / 개업','연간 신규 개업은 누적 창업 건수가 아닙니다.'],['02 / 폐업','가맹 계약종료 또는 해지를 실제 폐업과 동일시할 수 없습니다.'],['03 / 매출','평균 월 매출은 평균 연매출 ÷ 12. 순이익이나 신규 매장 예상 매출이 아닙니다.'],['04 / 매장','선택 연도 말의 가맹점 수를 기준으로 합니다.'],['05 / 비용','브랜드 제시 비용에 임대보증금, 권리금 등이 포함되는지 확인해야 합니다.'],['06 / 출처','원자료 출처, 기준연도, 갱신일, 결측 정책을 함께 제공해야 합니다.']];return `${pageHeader('DATA GUIDE / SCR-06','숫자의 기준부터, 탄탄하게.','데이터를 이해할수록 더 나은 질문을 할 수 있습니다.')}<section class="box" style="background:#fffbea"><span class="tag">예시 데이터</span> 현재 브랜드 8개와 2024/2025년 수치는 모두 시연용이며 실제 창업 판단에 사용할 수 없습니다.</section><div class="twocol" style="margin-top:16px">${sections.map(([h,p])=>`<div class="insight" style="margin:0"><div class="overline">FCHA TANTAN</div><h2>${h}</h2><p>${p}</p></div>`).join('')}</div>`}
function render(){q('#nav').innerHTML=pages.map(([id,l])=>`<button class="navbtn ${screen===id?'active':''}" onclick="navigate('${id}')" aria-current="${screen===id?'page':'false'}">${l}</button>`).join('');q('#app').innerHTML=`<div class="page">${({home,detail,compare:comparison,regions,saved,guide})[screen]()}</div>`}
render();
</script></body></html>
