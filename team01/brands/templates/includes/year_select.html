<label>
    <span class="sr-only">기준연도</span>
    <select name="year" aria-label="기준연도">
        {% for y in years %}
            <option value="{{ y }}" {% if y == year %}selected{% endif %}>{{ y }}년 기준</option>
        {% empty %}
            <option value="{{ year }}">{{ year }}년 기준</option>
        {% endfor %}
    </select>
</label>
